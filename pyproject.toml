[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-cinematographer"
version = "0.1.0"
description = "ComfyUI nodes that evaluate a frame geometrically and return the camera correction in metres, plus a re-shoot workflow for LTX + CrossView-Warp."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Magieva" }]
keywords = [
    "comfyui",
    "comfyui-nodes",
    "cinematography",
    "camera",
    "framing",
    "re-shoot",
    "ltx-video",
    "crossview-warp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
]

# The engine -- geometry, framing, scene, continuity, character, autoframe,
# reliability, elements, post, director, prompt -- is stdlib-only by design: it
# is pure arithmetic and string handling over metres, degrees and tags. ComfyUI
# is NOT a pip dependency -- it is the host application, and the node pack
# imports cleanly without it.
#
# numpy is deliberately NOT declared here even though CinemaGradeApply -- the
# one node that changes pixels -- needs it at execution time. ComfyUI already
# ships numpy, and declaring it would let pip install a second copy into a
# ComfyUI environment, which is a well-known way to break the host. It is
# imported lazily inside that node, so the package still imports without it.
# Use the `grade` extra to run that node outside ComfyUI.
dependencies = []

[project.urls]
Homepage = "https://github.com/nathaniel-magieva/ComfyUI-Cinematographer"
Repository = "https://github.com/nathaniel-magieva/ComfyUI-Cinematographer"
Issues = "https://github.com/nathaniel-magieva/ComfyUI-Cinematographer/issues"

[project.optional-dependencies]
# numpy is in `dev` as well as `grade`, and deliberately so: without it
# tests/test_nodes_grade_apply.py skips at module scope, so a dev environment
# without numpy reports a smaller total than the tree actually has. The skip is
# loud and carries its reason, but a test that never runs is not a test. Install
# `.[dev]` and the whole suite runs.
dev = ["pytest>=7.0", "numpy>=1.20"]
# Only needed to run CinemaGradeApply outside ComfyUI; ComfyUI ships numpy.
grade = ["numpy>=1.20"]

[tool.setuptools]
packages = ["cinematographer"]
include-package-data = false

[tool.comfy]
PublisherId = "magieva"
DisplayName = "ComfyUI-Cinematographer"
requires-comfyui = ">=0.3.0"
